<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Website</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <header class="carousel-container">
        <div id="carouselExampleIndicators" class="carousel slide">
          <div class="carousel-indicators">
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="0"
              class="active"
              aria-current="true"
              aria-label="Slide 1"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="1"
              aria-label="Slide 2"
            ></button>
            <button
              type="button"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="2"
              aria-label="Slide 3"
            ></button>
          </div>
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img
                src="../images/BMW.jpg"
                class="d-block w-100 carousel-image"
                alt="..."
              />
            </div>
            <div class="carousel-item">
              <img
                src="../images/BMW1.jpg"
                class="d-block w-100 carousel-image"
                alt="..."
              />
            </div>
            <div class="carousel-item">
              <img
                src="../images/BMW2.jpg"
                class="d-block w-100 carousel-image"
                alt="..."
              />
            </div>
          </div>
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev"
          >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </header>
      <main class="content">
        <div class="cards">
          <div class="card" style="width: 18rem">
            <img
              src="https://i.ytimg.com/vi/vwtYHcRtvag/hqdefault.jpg?s…AIYBjgBQAE=&rs=AOn4CLBaijkVCqPlu4ZYriwo3LnMdPRL-Q"
              class="card-img-top"
              alt="video image"
            />
            <div class="card-body">
              <h5 class="card-title">Interface and Generics in Typescript</h5>
              <a
                target="_blank"
                href="https://youtu.be/vwtYHcRtvag?si=SidFEyPg15qiR6Tz"
                class="btn btn-primary"
                >Watch Now</a
              >
            </div>
          </div>
          <div class="card" style="width: 18rem">
            <img
              src="https://i.ytimg.com/vi/GTyKTyw2GhI/hqdefault.jpg?s…AIYBjgBQAE=&rs=AOn4CLDgVDl2kR5c0Il9km1WVz2wDQd8-g"
              class="card-img-top"
              alt="video image"
            />
            <div class="card-body">
              <h5 class="card-title">
                Type definations and Axios in typescript
              </h5>
              <a
                target="_blank"
                href="https://youtu.be/GTyKTyw2GhI?si=IV4dYrXMPBVQU8Om"
                class="btn btn-primary"
                >Watch Now</a
              >
            </div>
          </div>
          <div class="card" style="width: 18rem">
            <img
              src="https://i.ytimg.com/vi/-AXlZw6Gatw/hqdefault.jpg?s…AIYBjgBQAE=&rs=AOn4CLCYttFR-Gt0SyGh_l9zDjmEBv0obg"
              class="card-img-top"
              alt="video image"
            />
            <div class="card-body">
              <h5 class="card-title">Crash course on Typescript with React</h5>
              <a
                target="_blank"
                href="https://youtu.be/-AXlZw6Gatw?si=Xc0Iyiu0kzQ6Th42"
                class="btn btn-primary"
                >Watch Now</a
              >
            </div>
          </div>
        </div>
      </main>

      <footer class="footer">
        copyright &copy; Abhishek Sharma 2026
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
