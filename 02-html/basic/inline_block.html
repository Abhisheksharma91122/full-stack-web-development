<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Block Elements</title>
</head>
<body>
    <div>
        <h1>Inline vs Block Elements</h1>
        <div>
            <h2>Inline Element</h2>
            <ul>
                <li>img</li>
                <li>span</li>
                <li>strong</li>
                <li>em</li>
                <li>a</li>
            </ul>
        </div>
        <div>
            <h2>Block Element</h2>
            <ul>
                <li>heading h1 to h6</li>
                <li>p</li>
                <li>ul & ol</li>
                <li>li</li>
                <li>div</li>
            </ul>
        </div>
    </div>
</body>
</html>
