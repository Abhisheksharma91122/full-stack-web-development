<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media</title>
  </head>
  <body>
    <h1>This is Media Learning</h1>
    <img src="../images/hc.png" width="200px" alt="profile picture" />

    <figure>
      <img src="../images/hc.png" alt="profile picture" width="200" />
      <figcaption>this is a caption for image</figcaption>
    </figure>

    <video
      src="../images/chai_pe_charcha-1080.mp4"
      controls
      width="400px"
      autoplay
      muted
    ></video>
    <!-- for youtube video playback -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/xb-fcoMMiTM?si=zm0TE8C5vQZOYwZn"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <button aria-label="Close menu">X</button>
  </body>
</html>
